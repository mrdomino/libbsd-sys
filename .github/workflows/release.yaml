name: Release

on: # zizmor: ignore[concurrency-limits] each tag is a unique ref; we never want to cancel an in-flight publish
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # for crates.io Trusted Publishing via rust-lang/crates-io-auth-action (PR #8)
      contents: read # for actions/checkout
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: sudo sh -c 'apt-get update && apt-get install -y libbsd-dev'
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
