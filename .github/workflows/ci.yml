name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo sh -c 'apt-get update && apt-get install -y libbsd-dev'
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update && rustup default 1.85
      - run: cargo build --verbose
      - run: cargo test --verbose

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags: ["", "--all-features"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo sh -c 'apt-get update && apt-get install -y libbsd-dev'
      - run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - run: cargo build --verbose ${{ matrix.flags }} # zizmor: ignore[template-injection] matrix.flags is a literal list defined inline
      - run: cargo test --verbose ${{ matrix.flags }} # zizmor: ignore[template-injection] matrix.flags is a literal list defined inline

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - run: cargo build --verbose
      - run: cargo test --verbose

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@b84ab5559b5a1bb4b8ee2737d2506a16e1737636 # v1.4.8
        with:
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo build --verbose
            cargo test --verbose

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build and test on OpenBSD
        uses: vmactions/openbsd-vm@18edb32f4e48dae5865d7b8b3a9587bc01218a20 # v1.4.4
        with:
          usesh: true
          prepare: |
            pkg_add rust
          run: |
            cargo build --verbose
            cargo test --verbose

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build and test on NetBSD
        uses: vmactions/netbsd-vm@0c26a4c4a5e234038862a4a53a00c905b8a107c9 # v1.4.2
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add rust
          run: |
            cargo build --verbose
            cargo test --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev
      - run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt --no-self-update && rustup default nightly
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

permissions:
  contents: read
