name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo sh -c 'apt-get update && apt-get install -y libbsd-dev'
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update && rustup default 1.85
      - run: cargo build --verbose
      - run: cargo test --verbose

  # Guard the version floors in Cargo.toml.  `msrv` above tests the
  # declared MSRV against the *newest* dependencies; this job tests the
  # declared MSRV against the *oldest* ones we claim to accept, which is
  # the combination a downstream `-Z minimal-versions` build actually
  # gets.  `direct-minimal-versions` lowers only our own direct
  # dependencies — plain `minimal-versions` would also lower transitive
  # ones (cc, via tcm-readpassphrase-vendored), whose floors are not
  # ours to be honest about.
  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo sh -c 'apt-get update && apt-get install -y libbsd-dev'
      - run: rustup toolchain install nightly 1.85 --profile minimal --no-self-update
      # -Z direct-minimal-versions is nightly-only; the resulting
      # lockfile is then built and tested on the MSRV toolchain.
      - run: cargo +nightly generate-lockfile -Z direct-minimal-versions
      - run: cargo +nightly tree --depth 1
      - run: cargo +1.85 build --verbose
      - run: cargo +1.85 test --verbose

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags: ["", "--all-features"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo sh -c 'apt-get update && apt-get install -y libbsd-dev'
      - run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - run: cargo build --verbose ${{ matrix.flags }} # zizmor: ignore[template-injection] matrix.flags is a literal list defined inline
      - run: cargo test --verbose ${{ matrix.flags }} # zizmor: ignore[template-injection] matrix.flags is a literal list defined inline

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - run: cargo build --verbose
      - run: cargo test --verbose

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo build --verbose
            cargo test --verbose

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test on OpenBSD
        uses: vmactions/openbsd-vm@e6c68b637a12e83519688d115d57d5b0b53923cd # v1.4.6
        with:
          usesh: true
          prepare: |
            pkg_add rust
          run: |
            cargo build --verbose
            cargo test --verbose

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test on NetBSD
        uses: vmactions/netbsd-vm@00081e82b14bc40114eb97f32b4455306828516b # v1.4.6
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add rust
          cache-after-prepare: true
          run: |
            cargo build --verbose
            cargo test --verbose
            # NetBSD is the only platform where vendored-readpassphrase
            # does anything, so exercise both sides of the feature here.
            cargo build --verbose --no-default-features
            cargo test --verbose --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev
      - run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt --no-self-update && rustup default nightly
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

permissions:
  contents: read
