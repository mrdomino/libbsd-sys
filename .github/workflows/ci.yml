name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo sh -c 'apt-get update && apt-get install -y libbsd-dev'
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update && rustup default 1.85
      - run: cargo build --verbose
      - run: cargo test --verbose

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags: ["", "--all-features"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo sh -c 'apt-get update && apt-get install -y libbsd-dev'
      - run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - run: cargo build --verbose ${{ matrix.flags }} # zizmor: ignore[template-injection] matrix.flags is a literal list defined inline
      - run: cargo test --verbose ${{ matrix.flags }} # zizmor: ignore[template-injection] matrix.flags is a literal list defined inline

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - run: cargo build --verbose
      - run: cargo test --verbose

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@a6de9343ef5747433d9c25784c90e84998b9d69a # v1.4.6
        with:
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo build --verbose
            cargo test --verbose

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build and test on OpenBSD
        uses: vmactions/openbsd-vm@d7d892b7b9ba97ed2747b0fc201be65037d64c3e # v1.4.0
        with:
          usesh: true
          prepare: |
            pkg_add rust
          run: |
            cargo build --verbose
            cargo test --verbose

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build and test on NetBSD
        uses: vmactions/netbsd-vm@eb3ba840926911ccf17dc9de235335cb27a02ba0 # v1.3.8
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add rust
          run: |
            cargo build --verbose
            cargo test --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install libbsd-dev
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev
      - run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt --no-self-update && rustup default nightly
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

permissions:
  contents: read
